# Canlı sunucu: docker compose -f deploy/docker-compose.prod.yml --env-file .env.production up -d
services:
  db:
    # Sürüm sabit (alt sürüm güncellemesini bilinçli yapın)
    image: postgres:17.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fabrikadann
      # Parola URL'ye gömülür: yalnızca harf, rakam, - ve _ kullanın (ör. base64url)
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD gerekli}
      # Uygulamanın kısıtlı rolü için (db-init/01-uygulama-rolu.sh)
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD gerekli}
      POSTGRES_DB: fabrikadann
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d:ro
    # Veritabanı dışarıya açılmaz; yalnızca iç ağdan
    networks: [internal]

  app:
    image: fabrikadann:latest
    restart: unless-stopped
    depends_on: [db]
    # Uygulamaya yalnızca ihtiyacı olan değişkenler verilir (süper kullanıcı parolası konteynere girmez);
    # migration için sahip rolün adresi yalnızca migrate komutunda -e ile verilir (bkz. docs/CANLIYA-ALMA.md)
    environment:
      NODE_ENV: production
      APP_URL: ${APP_URL:?APP_URL gerekli}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET gerekli}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-mock}
      IYZICO_API_KEY: ${IYZICO_API_KEY:-}
      IYZICO_SECRET_KEY: ${IYZICO_SECRET_KEY:-}
      IYZICO_BASE_URL: ${IYZICO_BASE_URL:-}
      # Trendyol ortak stok (boşsa kapalı; bkz. docs/CANLIYA-ALMA.md §5c)
      TRENDYOL_SELLER_ID: ${TRENDYOL_SELLER_ID:-}
      TRENDYOL_API_KEY: ${TRENDYOL_API_KEY:-}
      TRENDYOL_API_SECRET: ${TRENDYOL_API_SECRET:-}
      TRENDYOL_ENV: ${TRENDYOL_ENV:-prod}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-fabrikadann <siparis@fabrikadann.com>}
      # Uygulama kısıtlı rolle bağlanır
      DATABASE_URL: postgres://fabrikadann_app:${APP_DB_PASSWORD}@db:5432/fabrikadann
      UPLOAD_DIR: /app/uploads
      # İstemci IP'si yalnızca Caddy'nin yazdığı bu başlıktan okunur
      CLIENT_IP_HEADER: x-real-ip
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    volumes:
      - uploads:/app/uploads
    networks: [internal, web]

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on: [app]
    # Yalnızca IPv4: Docker IPv6 ağı kurulmadan IPv6 bağlantıları ağ geçidi IP'siyle görünür
    # (tüm IPv6 ziyaretçileri tek IP sayılır). AAAA kaydı yayımlamayın.
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [web]

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:

networks:
  internal:
    internal: true
  web:
