# Canlı sunucu: docker compose -f deploy/docker-compose.prod.yml --env-file .env.production up -d
services:
  db:
    # Sürüm sabit (alt sürüm güncellemesini bilinçli yapın)
    image: postgres:17.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fabrikadann
      # Parola URL'ye gömülür: yalnızca harf, rakam, - ve _ kullanın (ör. base64url)
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD gerekli}
      POSTGRES_DB: fabrikadann
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Veritabanı dışarıya açılmaz; yalnızca iç ağdan
    networks: [internal]

  app:
    image: fabrikadann:latest
    restart: unless-stopped
    depends_on: [db]
    env_file: ../.env.production
    environment:
      DATABASE_URL: postgres://fabrikadann:${POSTGRES_PASSWORD}@db:5432/fabrikadann
      UPLOAD_DIR: /app/uploads
      # İstemci IP'si yalnızca Caddy'nin yazdığı bu başlıktan okunur
      CLIENT_IP_HEADER: x-real-ip
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    volumes:
      - uploads:/app/uploads
    networks: [internal, web]

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on: [app]
    # Yalnızca IPv4: Docker IPv6 ağı kurulmadan IPv6 bağlantıları ağ geçidi IP'siyle görünür
    # (tüm IPv6 ziyaretçileri tek IP sayılır). AAAA kaydı yayımlamayın.
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [web]

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:

networks:
  internal:
    internal: true
  web:
