# Canlı sunucu: docker compose -f deploy/docker-compose.prod.yml --env-file .env.production up -d
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fabrikadann
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD gerekli}
      POSTGRES_DB: fabrikadann
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Veritabanı dışarıya açılmaz; yalnızca iç ağdan
    networks: [internal]

  app:
    image: fabrikadann:latest
    restart: unless-stopped
    depends_on: [db]
    env_file: ../.env.production
    environment:
      DATABASE_URL: postgres://fabrikadann:${POSTGRES_PASSWORD}@db:5432/fabrikadann
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    networks: [internal, web]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [web]

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:

networks:
  internal:
    internal: true
  web:
