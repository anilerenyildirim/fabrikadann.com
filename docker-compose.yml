services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fabrikadann
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yerel-gelistirme}
      POSTGRES_DB: fabrikadann
    # Yalnızca yerel makineye açık
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/db-init:/docker-entrypoint-initdb.d:ro
volumes:
  pgdata:
