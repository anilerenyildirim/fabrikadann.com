<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fabrikadann — Çok yakında</title>
<meta name="description" content="fabrikadann çok yakında yayında.">
<meta name="theme-color" content="#E85100">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preload" href="fonts/big-shoulders-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face {
    font-family: "Big Shoulders";
    font-style: normal;
    font-weight: 100 900;
    font-display: block;
    src: url("fonts/big-shoulders-latin-ext.woff2") format("woff2");
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
  }
  @font-face {
    font-family: "Big Shoulders";
    font-style: normal;
    font-weight: 100 900;
    font-display: block;
    src: url("fonts/big-shoulders-latin.woff2") format("woff2");
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }

  :root {
    --turuncu: #E85100;
    --beyaz: #fff;
    --bosluk: clamp(1.25rem, 5vw, 4.5rem);
    /* "fabrikadann" yazısının em cinsinden genişliği; isim ekranı bu orana göre dolduruyor */
    --isim-orani: 4.78;
    --isim-boyu: min(calc((100vw - 2 * var(--bosluk)) / var(--isim-orani)), 46vh, 24rem);
  }

  html {
    background: var(--turuncu);
    color: var(--beyaz);
    overflow-x: clip;
  }

  body {
    box-sizing: border-box;
    min-height: 100vh;
    min-height: 100svh;
    margin: 0;
    padding: var(--bosluk);
    padding-bottom: calc(var(--bosluk) + 4vh);
    display: grid;
    place-items: center;
    font-family: "Big Shoulders", Impact, Haettenschweiler, "Arial Narrow", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  ::selection {
    background: var(--beyaz);
    color: var(--turuncu);
  }

  .sahne {
    width: fit-content;
  }

  .isim {
    margin: 0;
    font-size: var(--isim-boyu);
    font-weight: 900;
    line-height: 0.8;
    white-space: nowrap;
  }

  /* İkinci n, birincinin tam üstünden çıkıp yerine kayar: "fabrikadan" → "fabrikadann" */
  .ikinci-n {
    display: inline-block;
    animation: cogal 0.5s cubic-bezier(0.65, 0, 0.15, 1) 0.7s backwards;
  }

  .etiket {
    display: inline-block;
    margin: calc(var(--isim-boyu) * 0.2) 0 0;
    padding: 0.3em 0.6em;
    background: var(--beyaz);
    color: var(--turuncu);
    font-size: clamp(1.25rem, calc(var(--isim-boyu) * 0.17), 3rem);
    font-weight: 800;
    line-height: 1;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    animation: bas 0.4s cubic-bezier(0.65, 0, 0.15, 1) 1.25s backwards;
  }

  @keyframes cogal {
    from { transform: translateX(-100%); }
  }

  @keyframes bas {
    from { clip-path: inset(0 100% 0 0); }
    to { clip-path: inset(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .ikinci-n,
    .etiket {
      animation: none;
    }
  }
</style>
</head>
<body>
  <main class="sahne">
    <h1 class="isim" aria-label="fabrikadann"><span aria-hidden="true">fabrikadan<span class="ikinci-n">n</span></span></h1>
    <p class="etiket">Çok yakında</p>
  </main>
</body>
</html>
